<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Nikon PTP/IP 无线传图工程制图：相机、无线链路与手机端">
  <defs>
    <pattern id="g40" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2534" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="g200" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0v200" fill="none" stroke="#1b2534" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#1b2534"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#f7f4ec"/>
  <rect width="1200" height="900" fill="url(#g40)"/>
  <rect width="1200" height="900" fill="url(#g200)"/>

  <!-- 顶部注释 + opcode 引线 -->
  <rect x="170" y="152" width="9" height="9" fill="#ff5a36"/>
  <text x="190" y="166" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" letter-spacing="3" fill="#1b2534" fill-opacity=".72">VENDOR OPCODE 0x9207 / 0x90C8 / 0x9532</text>
  <line x1="330" y1="178" x2="368" y2="296" stroke="#1b2534" stroke-width="1.1" stroke-dasharray="4 4" stroke-opacity=".6"/>

  <!-- 中心虚线 -->
  <line x1="150" y1="480" x2="700" y2="480" stroke="#1b2534" stroke-width="1.1" stroke-opacity=".4" stroke-dasharray="16 6 3 6"/>

  <!-- 相机机身 -->
  <rect x="200" y="360" width="420" height="240" rx="18" fill="none" stroke="#1b2534" stroke-width="3.4"/>
  <path d="M298 360l40-42h84l40 42" fill="none" stroke="#1b2534" stroke-width="3"/>
  <rect x="552" y="344" width="22" height="16" fill="none" stroke="#1b2534" stroke-width="2"/>
  <circle cx="563" cy="334" r="12" fill="none" stroke="#ff5a36" stroke-width="2.6"/>
  <rect x="308" y="392" width="58" height="30" rx="4" fill="none" stroke="#1b2534" stroke-width="2"/>
  <g stroke="#1b2534" stroke-width="1.4" stroke-opacity=".5">
    <line x1="226" y1="382" x2="226" y2="578"/><line x1="240" y1="382" x2="240" y2="578"/><line x1="254" y1="382" x2="254" y2="578"/><line x1="268" y1="382" x2="268" y2="578"/>
  </g>
  <!-- 镜头 -->
  <circle cx="420" cy="480" r="96" fill="none" stroke="#1b2534" stroke-width="3.4"/>
  <circle cx="420" cy="480" r="68" fill="none" stroke="#1b2534" stroke-width="2"/>
  <circle cx="420" cy="480" r="42" fill="#8de4d0" fill-opacity=".4" stroke="#1b2534" stroke-width="2"/>
  <path d="M383 452a48 48 0 0 1 42-16" fill="none" stroke="#1b2534" stroke-width="1.6" stroke-opacity=".7"/>
  <text x="566" y="566" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".58">Z 6II</text>

  <!-- 无线电波 -->
  <g fill="none" stroke="#ff5a36" stroke-width="2.2" stroke-dasharray="8 8">
    <path d="M659 434a60 60 0 0 1 0 92"/>
    <path d="M685 403a100 100 0 0 1 0 154"/>
    <path d="M711 373a140 140 0 0 1 0 214"/>
  </g>

  <!-- 数据包 -->
  <g font-family="'IBM Plex Mono',Consolas,monospace" font-size="12">
    <rect x="716" y="398" width="30" height="24" fill="none" stroke="#ff5a36" stroke-width="2"/>
    <text x="731" y="414" text-anchor="middle" fill="#ff5a36">N</text>
    <rect x="756" y="470" width="30" height="24" fill="none" stroke="#ff5a36" stroke-width="2"/>
    <text x="771" y="486" text-anchor="middle" fill="#ff5a36">J</text>
  </g>
  <path d="M746 428c14 10 20 24 24 42" fill="none" stroke="#ff5a36" stroke-width="1.4" stroke-dasharray="4 5"/>

  <!-- 手机端 -->
  <rect x="840" y="330" width="170" height="300" rx="22" fill="none" stroke="#1b2534" stroke-width="3.4"/>
  <rect x="856" y="362" width="138" height="238" rx="6" fill="none" stroke="#1b2534" stroke-width="2"/>
  <g fill="none" stroke="#1b2534" stroke-width="1.8">
    <rect x="870" y="380" width="48" height="42" rx="3"/>
    <path d="M876 414l12-13 9 8 12-15"/>
    <rect x="932" y="380" width="48" height="42" rx="3"/>
    <path d="M938 414l12-13 9 8 12-15"/>
    <rect x="870" y="436" width="48" height="42" rx="3"/>
    <path d="M876 470l12-13 9 8 12-15"/>
  </g>
  <rect x="932" y="436" width="48" height="42" rx="3" fill="#8de4d0" fill-opacity=".45" stroke="#1b2534" stroke-width="1.8"/>
  <text x="870" y="520" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="1" fill="#1b2534" fill-opacity=".72">24 RAW</text>
  <line x1="870" y1="534" x2="946" y2="534" stroke="#1b2534" stroke-width="1.4" stroke-opacity=".5"/>
  <line x1="870" y1="548" x2="922" y2="548" stroke="#1b2534" stroke-width="1.4" stroke-opacity=".5"/>
  <!-- 传输进度 -->
  <rect x="870" y="566" width="110" height="12" fill="none" stroke="#1b2534" stroke-width="1.6"/>
  <rect x="870" y="566" width="68" height="12" fill="#ff5a36"/>

  <!-- 链路标注 -->
  <g stroke="#1b2534" stroke-width="1.2">
    <line x1="200" y1="636" x2="200" y2="688"/>
    <line x1="620" y1="636" x2="620" y2="688"/>
  </g>
  <line x1="206" y1="678" x2="614" y2="678" stroke="#1b2534" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="410" y="668" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" letter-spacing="2" fill="#1b2534">PTP / IP · WIFI</text>

  <text x="170" y="766" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".55">FIG. 02 / WIRELESS TETHER</text>
  <text x="1030" y="766" text-anchor="end" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".55">SCALE NTS</text>
</svg>
