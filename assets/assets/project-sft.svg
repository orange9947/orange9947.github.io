<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="聊天记录 SFT 数据管线工程制图：原始消息、清洗脱敏与训练集">
  <defs>
    <pattern id="g40" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2534" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="g200" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0v200" fill="none" stroke="#1b2534" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <marker id="arrO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#ff5a36"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#f7f4ec"/>
  <rect width="1200" height="900" fill="url(#g40)"/>
  <rect width="1200" height="900" fill="url(#g200)"/>

  <!-- 阶段标签 -->
  <g font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".72">
    <rect x="150" y="152" width="9" height="9" fill="#ff5a36"/><text x="170" y="166">RAW 8.1M</text>
    <text x="530" y="166">FILTER</text>
    <text x="800" y="166">SFT SET</text>
  </g>

  <!-- 聊天气泡 1（含 PII 遮蔽） -->
  <rect x="150" y="300" width="230" height="118" rx="16" fill="none" stroke="#1b2534" stroke-width="3"/>
  <path d="M186 418l-22 26 6-26" fill="none" stroke="#1b2534" stroke-width="3"/>
  <rect x="170" y="322" width="150" height="10" rx="5" fill="#1b2534" fill-opacity=".3"/>
  <rect x="170" y="322" width="56" height="10" fill="#ff5a36"/>
  <rect x="186" y="322" width="12" height="10" fill="#f7f4ec"/>
  <rect x="210" y="322" width="12" height="10" fill="#f7f4ec"/>
  <rect x="234" y="322" width="12" height="10" fill="#f7f4ec"/>
  <rect x="170" y="348" width="190" height="10" rx="5" fill="#1b2534" fill-opacity=".72"/>
  <rect x="170" y="374" width="128" height="10" rx="5" fill="#1b2534" fill-opacity=".72"/>
  <text x="150" y="452" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="1" fill="#ff5a36">PII → ■■■</text>

  <!-- 聊天气泡 2 -->
  <rect x="196" y="486" width="230" height="118" rx="16" fill="none" stroke="#1b2534" stroke-width="3"/>
  <path d="M392 604l22 26-6-26" fill="none" stroke="#1b2534" stroke-width="3"/>
  <rect x="216" y="508" width="176" height="10" rx="5" fill="#1b2534" fill-opacity=".72"/>
  <rect x="216" y="534" width="140" height="10" rx="5" fill="#1b2534" fill-opacity=".72"/>
  <rect x="216" y="560" width="104" height="10" rx="5" fill="#1b2534" fill-opacity=".3"/>
  <rect x="216" y="560" width="46" height="10" fill="#ff5a36"/>

  <!-- 流向箭头 -->
  <line x1="446" y1="428" x2="504" y2="428" stroke="#ff5a36" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrO)"/>
  <line x1="446" y1="545" x2="504" y2="500" stroke="#ff5a36" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrO)"/>

  <!-- 过滤漏斗 + 去重梳齿 -->
  <g stroke="#1b2534" stroke-width="1.6">
    <line x1="534" y1="304" x2="534" y2="330"/><line x1="556" y1="304" x2="556" y2="330"/><line x1="578" y1="304" x2="578" y2="330"/><line x1="600" y1="304" x2="600" y2="330"/><line x1="622" y1="304" x2="622" y2="330"/>
  </g>
  <path d="M522 330h120l-44 96v56l-32 20v-76z" fill="none" stroke="#1b2534" stroke-width="3"/>
  <rect x="576" y="452" width="44" height="14" fill="#8de4d0" fill-opacity=".5" stroke="#1b2534" stroke-width="2"/>
  <line x1="646" y1="459" x2="700" y2="459" stroke="#ff5a36" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrO)"/>

  <!-- 数据集网格 -->
  <g fill="#8de4d0" fill-opacity=".45" stroke="#1b2534" stroke-width="2">
    <rect x="714" y="304" width="56" height="44"/>
    <rect x="782" y="304" width="56" height="44"/>
    <rect x="850" y="304" width="56" height="44"/>
    <rect x="918" y="304" width="56" height="44"/>
    <rect x="714" y="360" width="56" height="44"/>
    <rect x="782" y="360" width="56" height="44"/>
    <rect x="850" y="360" width="56" height="44"/>
    <rect x="918" y="360" width="56" height="44"/>
    <rect x="714" y="416" width="56" height="44"/>
    <rect x="850" y="416" width="56" height="44"/>
  </g>
  <g fill="none" stroke="#1b2534" stroke-width="1.8" stroke-dasharray="5 5" stroke-opacity=".55">
    <rect x="782" y="416" width="56" height="44"/>
    <rect x="918" y="416" width="56" height="44"/>
  </g>
  <rect x="786" y="472" width="56" height="44" fill="#ff5a36" fill-opacity=".9" stroke="#1b2534" stroke-width="2"/>
  <g fill="none" stroke="#1b2534" stroke-width="2">
    <rect x="714" y="472" width="56" height="44"/>
    <rect x="854" y="472" width="56" height="44"/>
    <rect x="918" y="472" width="56" height="44"/>
  </g>

  <!-- 数量标注 -->
  <path d="M1004 304v212M1004 304h10M1004 516h10" fill="none" stroke="#1b2534" stroke-width="1.4"/>
  <text x="1030" y="416" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" letter-spacing="1" fill="#1b2534">24,729</text>

  <text x="150" y="766" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".55">FIG. 04 / PRIVATE PIPELINE</text>
  <text x="1030" y="766" text-anchor="end" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".55">AIR-GAPPED</text>
</svg>
