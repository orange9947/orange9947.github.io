<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Klipper 运动平台工程制图：导轨、丝杆与四工具头">
  <defs>
    <pattern id="g40" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2534" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="g200" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0v200" fill="none" stroke="#1b2534" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#1b2534"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#ff5a36"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#f7f4ec"/>
  <rect width="1200" height="900" fill="url(#g40)"/>
  <rect width="1200" height="900" fill="url(#g200)"/>

  <!-- 顶部注释 -->
  <rect x="170" y="152" width="9" height="9" fill="#ff5a36"/>
  <text x="190" y="166" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" letter-spacing="3" fill="#1b2534" fill-opacity=".72">MOTION SYSTEM / 4 × TOOLHEAD</text>

  <!-- 步进电机 + 丝杆 -->
  <rect x="980" y="262" width="100" height="66" rx="4" fill="none" stroke="#1b2534" stroke-width="3"/>
  <circle cx="1030" cy="295" r="18" fill="none" stroke="#1b2534" stroke-width="2.2"/>
  <circle cx="1030" cy="295" r="5.5" fill="#1b2534"/>
  <rect x="952" y="287" width="28" height="16" fill="none" stroke="#1b2534" stroke-width="2"/>
  <text x="1030" y="354" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".58">NEMA 17</text>
  <rect x="196" y="278" width="14" height="34" fill="none" stroke="#1b2534" stroke-width="2.4"/>
  <line x1="210" y1="287" x2="952" y2="287" stroke="#1b2534" stroke-width="2.6"/>
  <line x1="210" y1="303" x2="952" y2="303" stroke="#1b2534" stroke-width="2.6"/>
  <g stroke="#1b2534" stroke-width="1.3" stroke-opacity=".8">
    <path d="M224 287l11 16M246 287l11 16M268 287l11 16M290 287l11 16M312 287l11 16M334 287l11 16M356 287l11 16M378 287l11 16M400 287l11 16M422 287l11 16M444 287l11 16M466 287l11 16M488 287l11 16M510 287l11 16M532 287l11 16M554 287l11 16M576 287l11 16M598 287l11 16M620 287l11 16M642 287l11 16M664 287l11 16M686 287l11 16M708 287l11 16M730 287l11 16M752 287l11 16M774 287l11 16M796 287l11 16M818 287l11 16M840 287l11 16M862 287l11 16M884 287l11 16M906 287l11 16M928 287l11 16"/>
  </g>

  <!-- 中心虚线 -->
  <line x1="150" y1="560" x2="1050" y2="560" stroke="#1b2534" stroke-width="1.1" stroke-opacity=".4" stroke-dasharray="16 6 3 6"/>

  <!-- 直线导轨 -->
  <rect x="170" y="596" width="860" height="34" rx="3" fill="none" stroke="#1b2534" stroke-width="3.2"/>
  <line x1="180" y1="608" x2="1020" y2="608" stroke="#1b2534" stroke-width="1.4"/>
  <g fill="none" stroke="#1b2534" stroke-width="1.5">
    <circle cx="210" cy="618" r="4.5"/><circle cx="292" cy="618" r="4.5"/><circle cx="374" cy="618" r="4.5"/><circle cx="456" cy="618" r="4.5"/><circle cx="538" cy="618" r="4.5"/><circle cx="620" cy="618" r="4.5"/><circle cx="702" cy="618" r="4.5"/><circle cx="784" cy="618" r="4.5"/><circle cx="866" cy="618" r="4.5"/><circle cx="948" cy="618" r="4.5"/>
  </g>

  <!-- 3 个常规工具头 -->
  <g fill="none" stroke="#1b2534" stroke-width="3">
    <rect x="268" y="532" width="104" height="64" rx="3"/>
    <rect x="280" y="398" width="80" height="134" rx="3"/>
    <rect x="628" y="532" width="104" height="64" rx="3"/>
    <rect x="640" y="398" width="80" height="134" rx="3"/>
    <rect x="808" y="532" width="104" height="64" rx="3"/>
    <rect x="820" y="398" width="80" height="134" rx="3"/>
  </g>
  <g stroke="#1b2534" stroke-width="1.4">
    <path d="M292 412h56M292 426h56M292 440h56M292 454h56M292 468h56"/>
    <path d="M652 412h56M652 426h56M652 440h56M652 454h56M652 468h56"/>
    <path d="M832 412h56M832 426h56M832 440h56M832 454h56M832 468h56"/>
  </g>
  <g fill="none" stroke="#1b2534" stroke-width="1.5">
    <circle cx="282" cy="548" r="3.2"/><circle cx="358" cy="548" r="3.2"/><circle cx="282" cy="580" r="3.2"/><circle cx="358" cy="580" r="3.2"/>
    <circle cx="642" cy="548" r="3.2"/><circle cx="718" cy="548" r="3.2"/><circle cx="642" cy="580" r="3.2"/><circle cx="718" cy="580" r="3.2"/>
    <circle cx="822" cy="548" r="3.2"/><circle cx="898" cy="548" r="3.2"/><circle cx="822" cy="580" r="3.2"/><circle cx="898" cy="580" r="3.2"/>
  </g>

  <!-- 激活工具头（橘红高亮） -->
  <g fill="none" stroke="#ff5a36" stroke-width="3.2">
    <rect x="448" y="532" width="104" height="64" rx="3"/>
    <rect x="460" y="398" width="80" height="134" rx="3"/>
  </g>
  <g stroke="#ff5a36" stroke-width="1.5" stroke-opacity=".85">
    <path d="M472 412h56M472 426h56M472 440h56M472 454h56M472 468h56"/>
  </g>
  <g fill="none" stroke="#ff5a36" stroke-width="1.6">
    <circle cx="462" cy="548" r="3.2"/><circle cx="538" cy="548" r="3.2"/><circle cx="462" cy="580" r="3.2"/><circle cx="538" cy="580" r="3.2"/>
  </g>
  <line x1="424" y1="372" x2="576" y2="372" stroke="#ff5a36" stroke-width="2.4" marker-start="url(#arrO)" marker-end="url(#arrO)"/>
  <text x="590" y="378" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" fill="#ff5a36">X+</text>
  <line x1="500" y1="632" x2="500" y2="676" stroke="#ff5a36" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrO)"/>
  <text x="514" y="674" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="1" fill="#ff5a36">PRIME</text>

  <!-- 尺寸标注 -->
  <g stroke="#1b2534" stroke-width="1.2">
    <line x1="170" y1="648" x2="170" y2="700"/>
    <line x1="1030" y1="648" x2="1030" y2="700"/>
  </g>
  <line x1="176" y1="690" x2="1024" y2="690" stroke="#1b2534" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="600" y="680" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" letter-spacing="2" fill="#1b2534">TRAVEL 350</text>

  <!-- 图号 -->
  <text x="170" y="766" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".55">FIG. 01 / MOTION</text>
  <text x="1030" y="766" text-anchor="end" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".55">SCALE NTS</text>
</svg>
