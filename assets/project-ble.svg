<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="BLE 协议逆向工程制图：手机端经 GATT 特征值写入控制风扇设备">
  <defs>
    <pattern id="g40" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2534" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="g200" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0v200" fill="none" stroke="#1b2534" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <marker id="arrO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#ff5a36"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#f7f4ec"/>
  <rect width="1200" height="900" fill="url(#g40)"/>
  <rect width="1200" height="900" fill="url(#g200)"/>

  <!-- 顶部注释 -->
  <rect x="170" y="152" width="9" height="9" fill="#ff5a36"/>
  <text x="190" y="166" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" letter-spacing="3" fill="#1b2534" fill-opacity=".72">GATT WRITE 0x02 / 0x03 → SWITCH / AUTO</text>

  <!-- 手机端 -->
  <rect x="180" y="300" width="190" height="330" rx="26" fill="none" stroke="#1b2534" stroke-width="3.4"/>
  <rect x="198" y="338" width="154" height="254" rx="8" fill="none" stroke="#1b2534" stroke-width="2"/>
  <rect x="216" y="366" width="118" height="56" rx="6" fill="none" stroke="#1b2534" stroke-width="2.4"/>
  <text x="275" y="400" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" fill="#1b2534">ON</text>
  <rect x="216" y="440" width="118" height="56" rx="6" fill="#ff5a36"/>
  <text x="275" y="474" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" fill="#fff">AUTO</text>
  <line x1="216" y1="530" x2="334" y2="530" stroke="#1b2534" stroke-width="1.5" stroke-opacity=".5"/>
  <line x1="216" y1="550" x2="302" y2="550" stroke="#1b2534" stroke-width="1.5" stroke-opacity=".5"/>
  <text x="180" y="672" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="2" fill="#1b2534" fill-opacity=".6">ANDROID · JAVA ≈300</text>

  <!-- BLE 电波 -->
  <g fill="none" stroke="#ff5a36" stroke-width="2.2" stroke-dasharray="8 8">
    <path d="M404 420a52 52 0 0 1 0 80"/>
    <path d="M428 392a92 92 0 0 1 0 136"/>
    <path d="M452 364a132 132 0 0 1 0 192"/>
  </g>

  <!-- GATT 特征值表 -->
  <rect x="520" y="270" width="200" height="50" rx="4" fill="none" stroke="#1b2534" stroke-width="2.4"/>
  <text x="620" y="302" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" letter-spacing="3" fill="#1b2534" fill-opacity=".7">SERVICE</text>
  <rect x="520" y="330" width="200" height="64" fill="none" stroke="#1b2534" stroke-width="2.4"/>
  <text x="545" y="369" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" fill="#1b2534" fill-opacity=".55">0x01</text>
  <text x="700" y="369" text-anchor="end" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" fill="#1b2534" fill-opacity=".45">RO</text>
  <rect x="520" y="394" width="200" height="64" fill="#8de4d0" fill-opacity=".45" stroke="#1b2534" stroke-width="2.6"/>
  <text x="545" y="433" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" fill="#1b2534">0x02</text>
  <text x="700" y="433" text-anchor="end" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" fill="#ff5a36">WRITE</text>
  <rect x="520" y="458" width="200" height="64" fill="none" stroke="#ff5a36" stroke-width="2.8"/>
  <text x="545" y="497" font-family="'IBM Plex Mono',Consolas,monospace" font-size="15" fill="#1b2534">0x03</text>
  <text x="700" y="497" text-anchor="end" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" fill="#ff5a36">WRITE</text>
  <text x="520" y="560" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="1" fill="#1b2534" fill-opacity=".6">CHARACTERISTICS · REVERSED</text>

  <!-- 写入指令流 -->
  <line x1="740" y1="426" x2="800" y2="426" stroke="#ff5a36" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrO)"/>

  <!-- 风扇 -->
  <circle cx="900" cy="426" r="118" fill="none" stroke="#1b2534" stroke-width="3.4"/>
  <circle cx="900" cy="426" r="96" fill="none" stroke="#1b2534" stroke-width="1.5" stroke-opacity=".55"/>
  <circle cx="900" cy="426" r="74" fill="none" stroke="#1b2534" stroke-width="1.5" stroke-opacity=".55"/>
  <g fill="#1b2534" fill-opacity=".85">
    <path d="M900 426c8-34 26-52 8-74-16-19-46-8-50 16-3 20 14 44 42 58z"/>
    <path d="M900 426c-30-18-56-16-64 4-8 22 12 44 36 40 19-4 32-24 28-44z"/>
    <path d="M900 426c22 26 46 34 62 20 17-15 8-45-15-53-19-7-42 8-47 33z"/>
  </g>
  <circle cx="900" cy="426" r="13" fill="none" stroke="#ff5a36" stroke-width="3"/>
  <text x="900" y="580" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="12" letter-spacing="2" fill="#1b2534" fill-opacity=".6">FAN · SWITCH / AUTO GEAR</text>

  <!-- RFID 联动 -->
  <rect x="170" y="700" width="150" height="58" rx="8" fill="none" stroke="#1b2534" stroke-width="2.6"/>
  <text x="245" y="736" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,monospace" font-size="14" fill="#1b2534" fill-opacity=".75">RFID</text>
  <path d="M336 714a26 26 0 0 1 0 30M352 704a44 44 0 0 1 0 50" fill="none" stroke="#ff5a36" stroke-width="2" stroke-dasharray="5 6"/>
  <line x1="245" y1="692" x2="245" y2="668" stroke="#1b2534" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity=".6"/>

  <text x="170" y="766" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".55">FIG. 08 / BLE CONTROL</text>
  <text x="1030" y="766" text-anchor="end" font-family="'IBM Plex Mono',Consolas,monospace" font-size="13" letter-spacing="2" fill="#1b2534" fill-opacity=".55">GATT · ANDROID</text>
</svg>
